name: Build and Publish Docker image

on:
  push:
    branches:
      - master
      - main
  # Pull requests build the image without pushing it, to catch a broken Dockerfile before merge.
  pull_request:
  # Weekly rebuild so base-image (nginx-unprivileged:alpine) security fixes ship without a code change.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PW }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: lewisdoesstuff/homepage

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: 'lewisdoesstuff/homepage:latest'
          labels: ${{ steps.meta.outputs.labels }}
